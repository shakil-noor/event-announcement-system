<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Announcements - Subscribe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 80px auto;
            padding: 20px;
            background: #f4f4f9;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        button:hover {
            background: #0056b3;
        }

        #status-message {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        .admin-link {
            margin-top: 30px;
            display: block;
            font-size: 12px;
            color: #888;
            text-decoration: none;
        }

        .admin-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Stay Updated</h1>
        <p>Subscribe to receive instant email notifications whenever a new event is announced.</p>

        <input type="email" id="sub-email" placeholder="Enter your email address">
        <button onclick="handleSubscribe()">Subscribe Now</button>

        <div id="status-message"></div>
    </div>

    <a href="admin.html" class="admin-link">Admin Portal</a>

    <script src="app.js"></script>
</body>

</html>
